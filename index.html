// Seen IDs survive edits/deletion and travel with JSON backups. Missing seen entries
// are user deletions; only genuinely new catalog IDs may be appended.
function migrate(d,catalog=PACKING_DEFAULTS){
  const history=d.packingDefaults||(d.packingDefaults={groups:[],items:[]});
  const seenGroups=new Set(history.groups),seenItems=new Set(history.items);
  const allItems=d.packing.flatMap(g=>g.items);
  const claimed=new Set(history.items);
  for(const template of catalog){
    let target=d.packing.find(g=>g.id===template.id);
    if(!seenGroups.has(template.id)){
      target=target||d.packing.find(g=>g.name===template.name);
      if(target){ // Retain the group position and all user settings; bind its stable catalog ID.
        target.id=template.id;
      }else{target={id:template.id,name:template.name,collapsed:false,items:[]};d.packing.push(target);}
      seenGroups.add(template.id);
    }
    for(const item of template.items){
      if(seenItems.has(item.id))continue;
      // Match exact legacy names once; never split or reinterpret combined/renamed items.
      const existing=allItems.find(i=>i.id===item.id)||
        (target?.items.find(i=>!claimed.has(i.id)&&i.name===item.name))||
        allItems.find(i=>!claimed.has(i.id)&&i.name===item.name);
      if(existing){claimed.add(existing.id);existing.id=item.id;claimed.add(item.id);}
      else if(target)target.items.push({id:item.id,name:item.name,done:false});
      seenItems.add(item.id);
    }
  }
  history.groups=[...seenGroups];history.items=[...seenItems];
  return d;
}

function edit(title,fields,callback){$('#dialogTitle').textContent=title;$('#fields').innerHTML=fields.map(f=>`<label>${esc(f.label)}<input name="${f.key}" type="${f.type||'text'}" value="${esc(f.value||'')}" maxlength="${f.key==='name'?200:2000}" ${f.required?'required':''}></label>`).join('');pending=callback;$('#editor').showModal();$('#fields input').focus();}
$('#cancel').onclick=()=>$('#editor').close();$('#form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));for(const k in values)values[k]=values[k].trim();if(!values.name)return;if(values.url&&!safeUrl(values.url)){alert('http:// 또는 https://로 시작하는 올바른 링크를 입력하세요.');return;}pending(values);$('#editor').close();persist();render();};
$('#view').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,g=state[tab].find(g=>g.id===b.closest('[data-group]')?.dataset.group),i=g?.items.find(i=>i.id===b.closest('[data-item]')?.dataset.item);if(a==='add-group'||a==='edit-group'){edit(a==='add-group'?'카테고리 추가':'이름 수정',[{key:'name',label:'이름',required:true,value:g?.name}],v=>a==='add-group'?state[tab].push(group(v.name)):g.name=v.name);return;}if(a==='add'||a==='edit'){const fields=[{key:'name',label:tab==='packing'?'준비물 이름':'장소 / 일정 이름',required:true,value:i?.name}];if(tab==='days')fields.push({key:'time',label:'시간 (선택)',type:'time',value:i?.time});if(tab!=='packing')fields.push({key:'note',label:'주소 · 메모 (선택)',value:i?.note},{key:'url',label:'장소 링크 (선택)',type:'url',value:i?.url});edit(a==='add'?'새 항목 추가':'항목 수정',fields,v=>a==='add'?g.items.push({id:uid(),done:false,...v}):Object.assign(i,v));return;}if(a==='collapse')g.collapsed=!g.collapsed;if(a==='check')i.done=b.checked;if(a==='delete'){if(!confirm(`“${i.name}” 항목을 삭제할까요?`))return;g.items=g.items.filter(x=>x!==i);}if(a==='delete-group'){if(!confirm(`“${g.name}” 카테고리와 안의 항목을 모두 삭제할까요?`))return;state[tab]=state[tab].filter(x=>x!==g);}if(['up','down','group-up','group-down'].includes(a)){const arr=a.startsWith('group')?state[tab]:g.items,index=arr.indexOf(a.startsWith('group')?g:i),next=index+(a.endsWith('up')?-1:1);if(next>=0&&next<arr.length)[arr[index],arr[next]]=[arr[next],arr[index]];}persist();render();});
document.querySelector('nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render();}};
document.querySelector('nav').onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tabs=['packing','places','days'];tab=tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector('[data-tab="'+tab+'"]').focus();};
$('#backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='영종도-여행-백업-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('5MB 이하의 백업 파일을 선택하세요.');const next=migrate(validate(JSON.parse(await file.text())));if(!confirm('현재 데이터를 백업 파일로 교체할까요? 필요한 경우 먼저 백업을 저장하세요.'))return;localStorage.setItem(KEY,JSON.stringify(next));state=next;storageBlocked=false;$('#warning').textContent='';persist();render();}catch(err){alert('복원하지 못했습니다: '+err.message);}finally{e.target.value='';}};
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{state=migrate(validate(JSON.parse(e.newValue)));render();$('#save').textContent='다른 탭의 변경을 반영했습니다';}catch{ $('#save').textContent='다른 탭의 데이터를 읽지 못했습니다';}});
// Touch and mouse share the same gesture model. Before a long press, vertical
// movement stays native scrolling; after it, touchmove is explicitly consumed.
let gesture=null,suppressClickUntil=0;
const gesturePoint=e=>e.touches?.[0]||e.changedTouches?.[0]||e;
function gestureStart(e){
  if(e.type==='mousedown'&&(e.button!==0||Date.now()<suppressClickUntil))return;
  if(e.touches?.length>1){gestureFinish(true);return;}
  if(e.target.closest('button,input,a')||$('#editor').open)return;
  const item=e.target.closest('.item'),header=e.target.closest('.cardhead');
  const node=item||header?.closest('.card');
  if(!node)return;
  const p=gesturePoint(e);
  gesture={node,item:!!item,x:p.clientX,y:p.clientY,lastX:p.clientX,lastY:p.clientY,drag:false,swipe:false,moved:false};
  gesture.timer=setTimeout(()=>{
    if(!gesture||(!gesture.item&&tab==='days'))return;
    gesture.drag=true;gesture.node.classList.add('dragging');
    navigator.vibrate?.(20);$('#save').textContent='위아래로 끌어 순서를 바꾸세요';
    gesture.frame=requestAnimationFrame(dragFrame);
  },450);
}
function dragPosition(){
  const g=gesture;if(!g?.drag)return;
  const hit=document.elementFromPoint(g.lastX,g.lastY);
  const target=hit?.closest(g.item?'.item':'.card');
  if(!target||target===g.node||target.parentElement!==g.node.parentElement)return;
  const rect=(g.item?target:target.querySelector('.cardhead')).getBoundingClientRect();
  target.parentElement.insertBefore(g.node,g.lastY<rect.top+rect.height/2?target:target.nextSibling);
}
function dragFrame(){
  if(!gesture?.drag)return;
  const y=gesture.lastY,edge=70;
  const speed=y<edge?-Math.ceil((edge-y)/7):y>innerHeight-edge?Math.ceil((y-innerHeight+edge)/7):0;
  if(speed){window.scrollBy(0,speed);dragPosition();}
  gesture.frame=requestAnimationFrame(dragFrame);
}
function gestureMove(e){
  const g=gesture;if(!g)return;
  if(e.touches?.length>1){gestureFinish(true);return;}
  const p=gesturePoint(e);g.lastX=p.clientX;g.lastY=p.clientY;
  const dx=p.clientX-g.x,dy=p.clientY-g.y;
  if(g.drag){if(e.cancelable)e.preventDefault();g.moved=true;dragPosition();return;}
  if(Math.hypot(dx,dy)>10){clearTimeout(g.timer);g.moved=true;}
  if(Math.abs(dy)>18&&!g.swipe){gestureFinish(true);return;}
  if(Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.5&&(g.item||tab!=='days'))g.swipe=true;
  if(g.swipe){if(e.cancelable)e.preventDefault();g.node.style.transform=`translateX(${Math.max(-100,Math.min(100,dx))}px)`;g.node.classList.toggle('swiping',Math.abs(dx)>75);}
}
function gestureFinish(cancelled=false){
  const g=gesture;if(!g)return;gesture=null;clearTimeout(g.timer);cancelAnimationFrame(g.frame);
  g.node.style.transform='';g.node.classList.remove('dragging','swiping');
  if(g.drag||g.moved||g.swipe)suppressClickUntil=Date.now()+500;
  if(cancelled){if(g.drag)render();return;}
  if(g.drag){
    if(g.item){const groupId=g.node.closest('.card').dataset.group,group=state[tab].find(x=>x.id===groupId);const byId=new Map(group.items.map(i=>[i.id,i]));group.items=[...g.node.parentElement.querySelectorAll('.item')].map(el=>byId.get(el.dataset.item));}
    else{const byId=new Map(state[tab].map(g=>[g.id,g]));state[tab]=[...$('#view').querySelectorAll('.card')].map(el=>byId.get(el.dataset.group));}
    persist();render();
  }else if(g.swipe&&Math.abs(g.lastX-g.x)>75){
    g.node.querySelector(g.item?'button[data-action="delete"]':'button[data-action="delete-group"]')?.click();
  }
}
$('#view').addEventListener('click',e=>{
  if(e.isTrusted&&Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}
},true);
$('#view').addEventListener('touchstart',gestureStart,{passive:true});
$('#view').addEventListener('mousedown',gestureStart);
document.addEventListener('touchmove',gestureMove,{passive:false});
document.addEventListener('mousemove',gestureMove);
document.addEventListener('touchend',()=>gestureFinish(),{passive:true});
document.addEventListener('mouseup',()=>gestureFinish());
document.addEventListener('touchcancel',()=>gestureFinish(true),{passive:true});
window.addEventListener('blur',()=>gestureFinish(true));
// Keyboard alternatives keep all actions available without touch gestures.
$('#view').addEventListener('keydown',e=>{
  const name=e.target.closest('.title,.content strong');if(!name)return;
  const item=name.closest('.item'),node=item||name.closest('.card');
  if(e.key==='Enter'||e.key===' '){e.preventDefault();name.click();}
  if(e.key==='Delete'){e.preventDefault();node.querySelector(item?'button[data-action="delete"]':'button[data-action="delete-group"]')?.click();}
  if(e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const action=(item?'':'group-')+(e.key==='ArrowUp'?'up':'down');node.querySelector(`button[data-action="${action}"]`)?.click();}
});

render();persist();
</script></body></html>
