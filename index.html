<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17685e"><title>영종에서의 3일</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193d39;background:#f5f6f0;line-height:1.5}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #cddbd3;background:white;color:#234a43;border-radius:10px;padding:9px 13px;min-height:44px}button:hover{background:#e4efe8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #da8a3c;outline-offset:2px}.primary{background:#17685e;color:white;border-color:#17685e}.danger{color:#a43d38}header{background:#dfece4;padding:40px 24px 32px;border-bottom:1px solid #cadcd0}.wrap{max-width:1000px;margin:auto}.eyebrow{letter-spacing:3px;font-size:12px;font-weight:700;color:#477768}h1{font-size:clamp(30px,6vw,48px);letter-spacing:-2px;margin:10px 0}h2{font-size:21px;margin:0}p{margin:8px 0}.muted{color:#62756d;font-size:14px}.toolbar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{margin-top:20px}.save{margin-left:auto;font-size:13px}nav{display:flex;gap:8px;padding:20px 0;position:sticky;top:0;background:#f5f6f0;z-index:2}nav button{flex:1}nav button[aria-selected=true]{background:#17685e;color:white;border-color:#17685e}main{padding:0 20px 48px}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 20px}.card{background:#fff;border:1px solid #dce4da;border-radius:18px;margin:14px 0;overflow:hidden;box-shadow:0 3px 12px #16372b05}.cardhead{padding:14px 18px;background:#edf2e9;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.title{font-weight:700;font-size:17px;flex:1}.cardbody{padding:4px 18px 16px}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf0e9;padding:13px 0}.item:last-of-type{border-bottom:0}.content{flex:1;min-width:0;overflow-wrap:anywhere}.content strong{display:block}.checked .content strong{text-decoration:line-through;color:#7b8b81}.actions{display:flex;gap:4px;flex-wrap:wrap}.actions button{padding:5px 9px;font-size:13px}.check{width:23px;height:23px;accent-color:#17685e;flex-shrink:0}.add{margin-top:12px;width:100%;border-style:dashed;background:#fafbf7}.empty{padding:25px 0;color:#718176;text-align:center}.badge{font-size:12px;background:#dceadd;border-radius:20px;padding:3px 9px}.progress{height:7px;background:#c7dacb;border-radius:8px;margin-top:18px;overflow:hidden}.progress span{display:block;background:#17685e;height:100%;transition:width .2s}dialog{border:0;border-radius:20px;padding:24px;width:min(92vw,460px);box-shadow:0 20px 80px #102f3640}dialog::backdrop{background:#17352e77}form label{display:block;margin:16px 0;font-weight:600}input:not([type=checkbox]),select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #bdcec1;border-radius:9px;background:white;color:#193d39}dialog h2{margin-bottom:20px}form .row{justify-content:flex-end}.notice{padding:12px 16px;border-radius:12px;background:#fff1dc;margin:12px 0;font-size:14px}footer{text-align:center;font-size:12px;color:#718176;margin-top:30px}@media(max-width:600px){header{padding:28px 20px 24px}.item{flex-wrap:wrap}.actions{margin-left:auto}.item>.actions{width:100%;justify-content:flex-end}.cardhead{padding:12px}.cardbody{padding:4px 12px 14px}.save{width:100%;margin-left:0}.toolbar button{flex:1}.intro{align-items:flex-start}nav{gap:5px}nav button{padding:10px 5px;font-size:14px}}
</style></head><body>
<header><div class="wrap"><div class="eyebrow">YEONGJONG · 2 NIGHTS / 3 DAYS</div><h1>영종에서의 3일 🌿</h1><p>바다 옆에서 쉬어가는 시간, 준비부터 마지막 일정까지.</p><div class="toolbar"><button id="backup">↓ 백업 저장</button><button id="restore">↑ 백업 복원</button><input id="file" type="file" accept="application/json,.json" hidden><span class="save" id="save" role="status" aria-live="polite">자동 저장 준비 중</span></div><div class="progress"><span id="bar"></span></div><p class="muted" id="summary"></p></div></header>
<main class="wrap"><div id="warning" role="alert"></div><nav role="tablist" aria-label="여행 관리"><button role="tab" data-tab="packing">✓ 준비물</button><button role="tab" data-tab="places">⌖ 장소 후보</button><button role="tab" data-tab="days">▦ 3일 일정</button></nav><section id="view"></section><footer>이 브라우저에 자동 저장됩니다 · 기기 이동 및 사이트 주소 변경 전에는 백업해 주세요.</footer></main>
<dialog id="editor"><form id="form"><h2 id="dialogTitle"></h2><div id="fields"></div><div class="row"><button type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
<script>
'use strict';
const KEY='yeongjong-travel-checklist', VERSION=1;
const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const group=(name,items=[])=>({id:uid(),name,collapsed:false,items:items.map(name=>({id:uid(),name,done:false}))});
const defaults=()=>({version:VERSION,packing:[group('기본 준비물',['신분증 · 운전면허증','충전기 · 보조배터리','세면도구 · 상비약']),group('차크닉 준비',['피크닉 매트 · 캠핑 의자','담요 · 가벼운 겉옷','간식 · 물 · 쓰레기봉투'])],places:[group('차크닉 장소'),group('카페'),group('맛집')],days:[group('1일차 · 도착과 바다'),group('2일차 · 느긋한 영종도'),group('3일차 · 마지막 산책')]});
function validate(d){if(!d||typeof d!=='object'||d.version!==VERSION)throw Error('지원하지 않는 백업 버전입니다.');for(const key of ['packing','places','days']){if(!Array.isArray(d[key])||d[key].length>200||(key==='days'&&d[key].length!==3))throw Error('여행 데이터 형식이 올바르지 않습니다.');const ids=new Set;for(const g of d[key]){if(!g||typeof g.id!=='string'||ids.has(g.id)||typeof g.name!=='string'||!g.name.trim()||g.name.length>200||!Array.isArray(g.items)||g.items.length>2000)throw Error('카테고리 데이터가 올바르지 않습니다.');ids.add(g.id);const itemIds=new Set;for(const i of g.items){if(!i||typeof i.id!=='string'||itemIds.has(i.id)||typeof i.name!=='string'||!i.name.trim()||i.name.length>200||typeof i.done!=='boolean'||['note','time','url'].some(k=>i[k]!==undefined&&(typeof i[k]!=='string'||i[k].length>2000)))throw Error('항목 데이터가 올바르지 않습니다.');itemIds.add(i.id);}if(g.collapsed!==undefined&&typeof g.collapsed!=='boolean')throw Error('접기 상태가 올바르지 않습니다.');}}return d;}
let state,tab='packing',pending=null,storageBlocked=false;
try{const raw=localStorage.getItem(KEY);state=raw?validate(JSON.parse(raw)):defaults();}catch(e){state=defaults();storageBlocked=true;$('#warning').innerHTML='<p class="notice">저장 데이터를 읽을 수 없어 자동 저장을 중단했습니다. 기존 데이터는 덮어쓰지 않습니다. 백업 파일을 복원하거나 현재 내용을 백업해 보관해 주세요.</p>';}
function persist(){if(storageBlocked){$('#save').textContent='자동 저장 중단 · 백업 필요';return;}try{localStorage.setItem(KEY,JSON.stringify(state));$('#save').textContent='자동 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}catch(e){$('#save').textContent='저장 실패 · 백업해 주세요';$('#warning').textContent='브라우저 저장 공간이나 권한을 확인하세요. 현재 데이터는 백업 버튼으로 보관할 수 있습니다.';}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(action,label,extra='',disabled=false)=>`<button type="button" data-action="${action}" ${extra} ${disabled?'disabled':''}>${label}</button>`;
function safeUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.tabIndex=b.dataset.tab===tab?0:-1;});const all=state.packing.flatMap(g=>g.items),done=all.filter(i=>i.done).length;$('#summary').textContent=`준비물 ${done} / ${all.length} 완료 · ${all.length?Math.round(done/all.length*100):0}% 준비됐어요`;$('#bar').style.width=(all.length?done/all.length*100:0)+'%';const titles={packing:['여행 전, 하나씩 챙겨요','준비물을 체크하고 나만의 카테고리로 정리하세요.'],places:['가고 싶은 곳을 모아요','주소와 메모를 남기고 방문한 곳은 체크하세요.'],days:['우리의 2박 3일','시간과 메모를 더해 하루의 흐름을 만들어 보세요.']};$('#view').innerHTML=`<div class="intro"><div><h2>${titles[tab][0]}</h2><p class="muted">${titles[tab][1]}</p></div>${tab!=='days'?btn('add-group','+ 카테고리'):''}</div>`+state[tab].map((g,gi)=>`<article class="card" data-group="${esc(g.id)}"><div class="cardhead"><button data-action="collapse" aria-expanded="${!g.collapsed}" aria-label="${esc(g.name)} ${g.collapsed?'펼치기':'접기'}">${g.collapsed?'＋':'−'}</button><span class="title">${esc(g.name)}</span><span class="badge">${g.items.filter(i=>i.done).length}/${g.items.length}</span><div class="actions">${tab!=='days'?btn('group-up','↑','aria-label="카테고리 위로"',gi===0)+btn('group-down','↓','aria-label="카테고리 아래로"',gi===state[tab].length-1):''}${btn('edit-group','수정')}${tab!=='days'?btn('delete-group','삭제','class="danger"'):''}</div></div>${g.collapsed?'':`<div class="cardbody">${g.items.length?g.items.map((i,ii)=>`<div class="item ${i.done?'checked':''}" data-item="${esc(i.id)}"><input class="check" type="checkbox" data-action="check" aria-label="${esc(i.name)} 완료" ${i.done?'checked':''}><div class="content"><strong>${i.time?esc(i.time)+' · ':''}${esc(i.name)}</strong>${i.note?`<div class="muted">${esc(i.note)}</div>`:''}${safeUrl(i.url)?`<a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">장소 링크 ↗</a>`:''}</div><div class="actions">${btn('up','↑','aria-label="항목 위로"',ii===0)}${btn('down','↓','aria-label="항목 아래로"',ii===g.items.length-1)}${btn('edit','수정')}${btn('delete','삭제','class="danger"')}</div></div>`).join(''):'<div class="empty">아직 비어 있어요. 첫 항목을 추가해 보세요.</div>'}${btn('add',tab==='places'?'+ 장소 추가':tab==='days'?'+ 일정 추가':'+ 준비물 추가','class="add"')}</div>`}</article>`).join('');}
function edit(title,fields,callback){$('#dialogTitle').textContent=title;$('#fields').innerHTML=fields.map(f=>`<label>${esc(f.label)}<input name="${f.key}" type="${f.type||'text'}" value="${esc(f.value||'')}" maxlength="${f.key==='name'?200:2000}" ${f.required?'required':''}></label>`).join('');pending=callback;$('#editor').showModal();$('#fields input').focus();}
$('#cancel').onclick=()=>$('#editor').close();$('#form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));for(const k in values)values[k]=values[k].trim();if(!values.name)return;if(values.url&&!safeUrl(values.url)){alert('http:// 또는 https://로 시작하는 올바른 링크를 입력하세요.');return;}pending(values);$('#editor').close();persist();render();};
$('#view').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,g=state[tab].find(g=>g.id===b.closest('[data-group]')?.dataset.group),i=g?.items.find(i=>i.id===b.closest('[data-item]')?.dataset.item);if(a==='add-group'||a==='edit-group'){edit(a==='add-group'?'카테고리 추가':'이름 수정',[{key:'name',label:'이름',required:true,value:g?.name}],v=>a==='add-group'?state[tab].push(group(v.name)):g.name=v.name);return;}if(a==='add'||a==='edit'){const fields=[{key:'name',label:tab==='packing'?'준비물 이름':'장소 / 일정 이름',required:true,value:i?.name}];if(tab==='days')fields.push({key:'time',label:'시간 (선택)',type:'time',value:i?.time});if(tab!=='packing')fields.push({key:'note',label:'주소 · 메모 (선택)',value:i?.note},{key:'url',label:'장소 링크 (선택)',type:'url',value:i?.url});edit(a==='add'?'새 항목 추가':'항목 수정',fields,v=>a==='add'?g.items.push({id:uid(),done:false,...v}):Object.assign(i,v));return;}if(a==='collapse')g.collapsed=!g.collapsed;if(a==='check')i.done=b.checked;if(a==='delete'){if(!confirm(`“${i.name}” 항목을 삭제할까요?`))return;g.items=g.items.filter(x=>x!==i);}if(a==='delete-group'){if(!confirm(`“${g.name}” 카테고리와 안의 항목을 모두 삭제할까요?`))return;state[tab]=state[tab].filter(x=>x!==g);}if(['up','down','group-up','group-down'].includes(a)){const arr=a.startsWith('group')?state[tab]:g.items,index=arr.indexOf(a.startsWith('group')?g:i),next=index+(a.endsWith('up')?-1:1);if(next>=0&&next<arr.length)[arr[index],arr[next]]=[arr[next],arr[index]];}persist();render();});
document.querySelector('nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render();}};
document.querySelector('nav').onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tabs=['packing','places','days'];tab=tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector('[data-tab="'+tab+'"]').focus();};
$('#backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='영종도-여행-백업-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('5MB 이하의 백업 파일을 선택하세요.');const next=validate(JSON.parse(await file.text()));if(!confirm('현재 데이터를 백업 파일로 교체할까요? 필요한 경우 먼저 백업을 저장하세요.'))return;localStorage.setItem(KEY,JSON.stringify(next));state=next;storageBlocked=false;$('#warning').textContent='';persist();render();}catch(err){alert('복원하지 못했습니다: '+err.message);}finally{e.target.value='';}};
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{state=validate(JSON.parse(e.newValue));render();$('#save').textContent='다른 탭의 변경을 반영했습니다';}catch{ $('#save').textContent='다른 탭의 데이터를 읽지 못했습니다';}});
render();persist();
</script></body></html>
